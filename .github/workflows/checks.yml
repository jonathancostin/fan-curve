name: Checks

on:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: swift run FanCurveCheck
      - run: ./scripts/build.sh
      - run: codesign --verify --deep --strict build/FanCurve.app
      - run: build/FanCurve.app/Contents/Resources/FanCurveProbe --check-output | python3 -m json.tool >/dev/null
